# Checks every push and pull request, and on a v* tag publishes every platform as one release.
# Edge/Chrome and Safari get zips on the release. The iPad userscript and the Android bookmarklet
# load from jsDelivr @latest, which follows the newest tag, so they switch over at the same time.
# The Safari app is signed to run locally only, so Safari still needs "Allow unsigned extensions".

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generated scripts match content.js
        run: |
          sh userscript/build.sh
          sh bookmarklet/build.sh
          if ! git diff --exit-code -- userscript bookmarklet; then
            echo "Run userscript/build.sh and bookmarklet/build.sh, then commit the result."
            exit 1
          fi

      - name: Tag matches manifest.json
        if: github.ref_type == 'tag'
        run: |
          version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version."
            exit 1
          fi

  build:
    needs: check
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      PROJECT: safari/NTHU OAuth Captcha/NTHU OAuth Captcha.xcodeproj
      APP: NTHU OAuth Captcha.app
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          version="$(plutil -extract version raw manifest.json)"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "NTHU OAuth Captcha" \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$version"
          echo "ZIP=nthu-oauth-captcha-safari.zip" >> "$GITHUB_ENV"

      - name: Package
        run: |
          cd build/Build/Products/Release
          codesign --verify --deep --strict "$APP"
          lipo -info "$APP/Contents/MacOS/NTHU OAuth Captcha"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/$ZIP"

      - uses: actions/upload-artifact@v7
        with:
          name: safari
          path: ${{ env.ZIP }}

  extension:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Package
        run: |
          stage="${RUNNER_TEMP}/nthu-oauth-captcha"
          mkdir -p "$stage"
          cp manifest.json content.js MIT-ccxpLite.txt NOTICE.txt "$stage/"
          cp -a icons model "$stage/"
          # Files sit at the top of the zip, so Windows "Extract All" gives one folder with manifest.json inside.
          # The name has no version, so each update extracts over the same folder.
          zipname="nthu-oauth-captcha-chrome.zip"
          (cd "$stage" && zip -r "$GITHUB_WORKSPACE/$zipname" .)
          if unzip -l "$zipname" | grep -Ei 'safari|xcodeproj|\.swift|\.app/|\.plist'; then
            echo "Edge/Chrome package contains Mac project files"
            exit 1
          fi
          echo "ZIP=$zipname" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: chrome
          path: ${{ env.ZIP }}

  release:
    needs: [build, extension]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f -name '*.zip')
          cat > notes.md <<EOF
          各平台下載哪一個：

          - Edge / Chrome：下面的 \`nthu-oauth-captcha-chrome.zip\`
          - macOS Safari：下面的 \`nthu-oauth-captcha-safari.zip\`
          - iPad / iPhone Safari、Android Chrome：不用下載，已裝好的會自動換成這一版，安裝方式見 [README](https://github.com/$GITHUB_REPOSITORY#readme)

          不要下載最底下的 **Source code**，那是整個原始碼，不是外掛。

          EOF
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
          fi

      # jsDelivr caches @latest for hours; clear it so the new tag is served right away.
      - name: Refresh jsDelivr
        run: |
          for file in userscript/nthu-oauth-captcha.user.js bookmarklet/nthu-oauth-captcha.js; do
            curl -fsS "https://purge.jsdelivr.net/gh/$GITHUB_REPOSITORY@latest/$file" \
              || echo "::warning::Could not purge $file from jsDelivr"
          done
